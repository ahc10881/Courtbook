<!DOCTYPE html>
<html>
<head>
    <title>Court Book</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark bg-dark navbar-expand-lg">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">Court Book</a>

        <div>
	<a href="/all-cases"class="btn btn-light btn-sm">All Cases</a>
	<a href="/import-cause-list" class="btn btn-primary btn-sm">Import List</a>
            <a href="/add-case" class="btn btn-success btn-sm">Add Case</a>
                        <a href="/search" class="btn btn-info btn-sm">Search</a>
            <a href="/logout" class="btn btn-danger btn-sm">Logout</a>
        </div>
    </div>
</nav>

<div class="container mt-4">

{% with messages = get_flashed_messages() %}
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-success">{{ message }}</div>
        {% endfor %}
    {% endif %}
{% endwith %}

{% block content %}
{% endblock %}

</div>

</body>
</html>
