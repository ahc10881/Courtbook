{% extends 'base.html' %}

{% block content %}

<div class="card">

    <div class="card-header">
        Import Cause List
    </div>

    <div class="card-body">

        <form method="POST">

            <div class="mb-3">

                <label class="form-label">
                    Paste Complete Court List
                </label>

                <textarea
                    name="raw_text"
                    class="form-control"
                    rows="25"
                    placeholder="Paste full court list here..."
                    required></textarea>

            </div>

            <button class="btn btn-primary">
                Import Cause List
            </button>

        </form>

    </div>

</div>

{% endblock %}
